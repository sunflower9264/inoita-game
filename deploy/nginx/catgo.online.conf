# HTTPS 入口：https://catgo.online:4002/
# 游戏静态服务仍由 inoita-game.service 提供，但只监听 127.0.0.1:4004。
# 证书由 certbot 管理：/etc/letsencrypt/live/catgo.online/
server {
    listen 4002 ssl http2;
    listen [::]:4002 ssl http2;
    server_name catgo.online;

    ssl_certificate     /etc/letsencrypt/live/catgo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catgo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:STORY_TLS:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:4004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
